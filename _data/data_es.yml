career-profile:
  title: Perfil Profesional
  summary: |
    Desarrollador Backend Senior con más de 15 años de experiencia en desarrollo web
    full-stack, especializado en PHP y Laravel. Actualmente contratista remoto para ZiffMedia,
    en sitios de alto tráfico como PCMag, CNET y ZDNet, además de Mashable, Lifehacker y
    ExtremeTech. Fundador y desarrollador
    principal de Fiscalízame, un SaaS de facturación electrónica y punto de venta para
    negocios de El Salvador, diseñado, construido y operado de punta a punta.

    Practicante del desarrollo AI-first: usa agentes de programación (Claude Code, Codex,
    GitHub Copilot, Gemini CLI, Cursor) en todo el ciclo, desde la definición del problema y
    la planificación hasta la implementación y la revisión, a menudo varios en paralelo,
    tanto localmente con Git worktrees como en entornos en la nube. También los usa para
    implementar interfaces UI/UX siguiendo las directrices del equipo de diseño, e integra
    funciones de IA en productos, desde integraciones con varios proveedores de LLM hasta el
    control de costo por llamada.

