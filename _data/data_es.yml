projects:
  title: Proyectos
  intro: >
    Proyectos de código abierto y productos propios. Algunos viven en
    repositorios privados, por lo que solo se enlaza su sitio público.
  private_label: Repositorio privado
  stack_label: "Tecnologías:"
  assignments:
    - title: Fiscalízame
      link: "https://fiscaliza.me"
      private: true
      tagline: "SaaS multiempresa para negocios de El Salvador: facturación electrónica (emisión, firma y envío de facturas al Ministerio de Hacienda), punto de venta, inventario, listas de precios, gastos y reportes fiscales. Soporta en paralelo dos versiones de la API de facturación electrónica del gobierno, con arquitectura modular y cada documento validado contra los esquemas oficiales mediante pruebas de regresión. Firma los documentos con sv-dte-signer (abajo)."
      stack: "PHP 8.4, Laravel 13, Livewire, Alpine.js, Tailwind CSS, PostgreSQL, Pest, Docker"
    - title: Glosia
      link: "https://glosia.app"
      private: true
      tagline: "App para aprender idiomas leyendo: importa un libro o texto y cada palabra se vuelve interactiva, con traducción contextual por IA y repaso con repetición espaciada. App web instalable (PWA) que funciona sin conexión, con pagos de suscripciones integrados con Gumroad y presupuesto de IA por cuenta para controlar costos; app para iOS (Capacitor, compras dentro de la app vía RevenueCat) en desarrollo."
      stack: "Next.js, React, TypeScript, Supabase, Drizzle ORM, Tailwind CSS, Capacitor, Claude / Gemini / Grok"
    - title: "@marzlabs/ai-providers"
      private: true
      tagline: "Paquete npm que reúne Anthropic (Claude), Google (Gemini) y xAI (Grok) detrás de una sola interfaz: cambiar de proveedor de IA es cambiar el nombre del modelo, no reescribir código. Resuelve las respuestas estructuradas, el caché de prompts y el registro de tokens y costo por llamada. Lo usa Glosia."
      stack: "TypeScript, Node.js, Vitest, SDKs de Anthropic / Google GenAI / OpenAI"
    - title: sv-dte-signer
      link: "https://github.com/marzsv/sv-dte-signer"
      tagline: "SDK en PHP para firmar digitalmente DTE (documentos tributarios electrónicos) de El Salvador. Incluye firma local sin servidores externos, firmas JWS RS512 y cobertura completa de pruebas."

