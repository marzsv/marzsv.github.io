experiences:
  title: Experiencia Laboral
  info:
    - role: Fundador y Desarrollador Principal
      time: Jun 2025 - Presente
      company: Fiscalízame (fiscaliza.me)
      details: |
        Diseño, desarrollo y operación de un SaaS multiempresa para negocios de El Salvador:
        facturación electrónica integrada con la API del Ministerio de Hacienda, punto de venta,
        inventario, gastos y reportes fiscales. A cargo de todo el ciclo (producto, arquitectura,
        desarrollo y despliegue) con Laravel, Livewire y PostgreSQL y un flujo de trabajo AI-first.

    - role: Desarrollador Backend Senior (Contratista)
      time: Sep 2023 - Presente
      company: ZiffMedia (Remoto, vía InAllMedia)
      details: |
        Trabajo en los sitios más grandes de la empresa: PCMag y, tras su adquisición, CNET y
        ZDNet, incluidas sus recientes migraciones de plataforma. Cuando la empresa adquirió el
        contenido de Lifehacker sin su plataforma, migración de todo el archivo mediante un
        proceso ETL (extracción, transformación y carga) y construcción de la nueva plataforma
        en Laravel: un CMS en Nova para el equipo editorial y el sitio público. Además, trabajo
        en Mashable y ExtremeTech.

    - role: Desarrollador Web Full Stack (Contratista Independiente)
      time: Ago 2020 - Sep 2023
      company: Luep (Remoto, Texas, EE. UU.)
      details: |
        Responsable principal del backend de una red social para comunidades cerradas, como
        universidades e iglesias: la API que consumían sus aplicaciones móviles nativas, con PHP
        (Laravel, CodeIgniter) y MySQL, además de funcionalidades de su aplicación web
        (JavaScript, jQuery). Detección y corrección de cuellos de botella de rendimiento, sobre
        todo consultas a la base de datos que no usaban índices. Integración de Pusher para
        eventos en tiempo real y Firebase para notificaciones push.

    - role: Desarrollador Web Full Stack (Contratista)
      time: Jul 2019 - Ago 2020
      company: Ministry Brands (vía InAllMedia)
      details: |
        Desarrollo de una aplicación web para administrar iglesias y comunidades: asistencia de
        miembros, donaciones, anuncios y reportería. Construcción de su sistema de reportes, que
        incluía cada dato de forma condicional según lo que se buscaba, además de nuevas
        funcionalidades y corrección de errores. Participación en el análisis de requerimientos
        y el diseño de soluciones con los product owners, junto a los equipos de UI/UX y móvil.
        Framework PHP propio, MySQL, SCSS, jQuery y Docker.

    - role: Desarrollador PHP (Contratista)
      time: Ene 2019 - Jul 2019
      company: Appetize (vía Avantica)
      details: |
        Corrección de errores, mantenimiento de código legado y desarrollo de nuevas
        funcionalidades en la aplicación administrativa de una plataforma de punto de venta:
        productos y catálogo, inventario, listas de precios y clientes. PHP 5.6/7.2, CodeIgniter
        y MySQL.

    - role: Desarrollador Full Stack Lead / Sysadmin
      time: Ene 2012 - Dic 2018
      company: WOWFI (Remoto)
      details: |
        Liderazgo de un equipo de cuatro personas en una red de Wi-Fi público gratuito para
        ciudades y locales como restaurantes, cafeterías y aeropuertos, con un portal cautivo
        dinámico desde el que los administradores publicaban publicidad segmentada. Migración
        de la aplicación de MySQL a MongoDB, reemplazo de FreeRADIUS por un servidor de
        autenticación open source adaptado al producto y automatización de la infraestructura
        en AWS con Chef/OpsWorks. PHP (Symfony2) y Python (Flask).

    - role: Desarrollador IT / DBA
      time: Dic 2010 - Feb 2012
      company: Dada Dada & Cía
      details: |
        Desarrollo de aplicaciones de escritorio y web con UniPaaS, un CRM de seguimiento de
        ventas y herramientas internas en Visual Basic; gestión de bases de datos MySQL.

    - role: Desarrollador IT
      time: Mar 2009 - Oct 2010
      company: Transactel SA de CV
      details: |
        Desarrollo de aplicaciones web con PHP y Symfony 1, incluido un sistema de seguimiento
        de tareas y tiempo de los empleados, con interfaces en HTML, CSS y JavaScript; gestión
        de bases de datos MySQL.

