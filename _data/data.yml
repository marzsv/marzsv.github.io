career-profile:
  title: Career Profile
  summary: |
    Senior Backend Developer with 15+ years building web applications, specialized in PHP
    and Laravel. Currently a remote contractor for ZiffMedia, working on high-traffic sites
    such as Mashable, PCMag, Lifehacker and ExtremeTech. Founder and lead developer of
    Fiscalízame, an e-invoicing and point-of-sale SaaS for businesses in El Salvador,
    designed, built and run end to end.

    AI-first practitioner: uses coding agents (Claude Code, Codex, GitHub Copilot, Cursor)
    throughout planning, implementation and review, often orchestrating several in parallel,
    and builds AI features into products, from multi-provider LLM integrations to
    per-call cost control.

