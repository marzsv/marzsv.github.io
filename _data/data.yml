career-profile:
  title: Career Profile
  summary: |
    Senior Backend Developer with 15+ years of experience in full-stack web development.
    Currently working remotely for ZiffMedia, specializing in Laravel, PHP frameworks,
    and modern web technologies. Proven track record of delivering high-quality solutions
    for high-traffic websites including Mashable, PCMag, Lifehacker, and ExtremeTech.
    Also founder and lead developer of Fiscalízame, an e-invoicing and point-of-sale
    SaaS for businesses in El Salvador, built and run end to end.

    Practitioner of AI-first and agentic coding methodologies, integrating AI tools
    throughout the entire development lifecycle—from problem definition and planning
    to implementation. Experienced orchestrating multiple AI agents simultaneously,
    both locally using Git Worktrees and cloud-based environments. Proficient with
    Claude Code, GitHub Copilot, Codex, Gemini CLI, and Cursor editor. Also leverages
    these tools to implement UI/UX interfaces following design team guidelines.

