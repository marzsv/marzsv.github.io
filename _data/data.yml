experiences:
  title: Experiences
  info:
    - role: Founder & Lead Developer
      time: Jun 2025 - Present
      company: Fiscalízame (fiscaliza.me)
      details: |
        Designed, built and operate a multi-tenant SaaS for businesses in El Salvador:
        electronic invoicing integrated with the tax authority's API, point of sale,
        inventory, expenses and tax reports. Own the full lifecycle (product, architecture,
        development and deployment) with Laravel, Livewire and PostgreSQL and an AI-first workflow.

    - role: Senior Backend Developer (Contractor)
      time: Sep 2023 - Present
      company: ZiffMedia (Remote, via InAllMedia)
      details: |
        When the company acquired Lifehacker's content without its platform, migrated the
        entire archive through an ETL pipeline (extraction, transformation and loading) and
        built the new platform on Laravel: a Nova-based CMS for the editorial team and the
        public website. Also worked on other high-traffic sites, including Mashable, PCMag
        and ExtremeTech.

    - role: Full Stack Web Developer (Independent Contractor)
      time: Aug 2020 - Sep 2023
      company: Luep (Remote, Texas, USA)
      details: |
        Mainly responsible for the backend of a social network for closed communities such as
        universities and churches: the API behind its native mobile apps, built with PHP
        (Laravel, CodeIgniter) and MySQL. Found and fixed performance bottlenecks, mostly
        database queries that were not using indexes. Integrated Pusher for real-time events
        and Firebase for push notifications.

    - role: Full Stack Web Developer (Contractor)
      time: Jul 2019 - Aug 2020
      company: Ministry Brands (via InAllMedia)
      details: |
        Collaborated with product owners on requirement analysis and solution design.
        Worked with UI/UX and mobile teams. Technologies: HTML5, CSS3 (SCSS),
        custom PHP framework, MySQL, jQuery, Docker.

    - role: PHP Developer (Contractor)
      time: Jan 2019 - Jul 2019
      company: Appetize (via Avantica)
      details: |
        Developed new features and maintained legacy code. Focused on clean,
        efficient code using PHP 5.6/7.2 within CodeIgniter framework alongside MySQL.

    - role: Lead Full Stack Developer / Sysadmin
      time: Jan 2012 - Dec 2018
      company: WOWFI (Remote)
      details: |
        Led software product development using PHP/Symfony2 and Python/Flask.
        Managed AWS infrastructure with Chef/OpsWorks automation.
        Maintained SQL and NoSQL databases.

    - role: IT Developer / DBA
      time: Dec 2010 - Feb 2012
      company: Dada Dada & Cía
      details: |
        Built desktop and web applications with UniPaaS, a sales-tracking CRM and internal
        Visual Basic tools; managed MySQL databases.

    - role: IT Developer
      time: Mar 2009 - Oct 2010
      company: Transactel SA de CV
      details: |
        Built web applications with PHP and Symfony 1, including an employee time-tracking
        system; managed MySQL databases.

